# settings of the project it stores the arguments and hyperparameters of the project

data:
  dataset: 'house-prices-advanced-regression-techniques'
  data_path: 'data/raw'
  target_column: 'SalePrice'

split:
  validation_size: 0.2
  random_state: 42
  strategy: 'random'

preprocessor:
  existence_feature:
    GarageExist: 'GarageYrBlt'
    BsmtExist: 'BsmtCond'

  absence_feature: 'None'

  garage:
    
    numerical_features: 
      - 'GarageYrBlt'
      - 'GarageArea'
      - 'GarageCars'
    categorical_features:
      - 'GarageFinish'
      - 'GarageQual'
      - 'GarageCond'
      - 'GarageType'
    

  bsmt:
    numerical_features:

    categorical_features:
      - 'BsmtCond'
      - 'BsmtQual'
      - 'BsmtExposure'
      - 'BsmtFinType1'
      - 'BsmtFinType2'
   

  lotfrontage:
    strategy: 'neighborhood_median'
    fallback: 'overall_median'

  electrical:
    feature: 'Electrical'
    strategy: 'most_frequent'

  other_cat_feature:
    features: 
      - 'Alley'
      - "MSSubClass"
      - "Condition1"
      - "Condition2"
      - "SaleType"
      - "SaleCondition"
      - "MiscFeature"
      - 'MasVnrType'
    strategy: 'constant'
    fill_value: 'None'

  masvnr_feature:
    features:
      - 'MasVnrType'
      - 'MasVnrArea'

  skewness:
    features:
    - 'LotFrontage'
    - 'MiscVal'
    - 'LotArea'
    method: 'log1p'

  ordinal:
    quality:
      features:
        - 'ExterQual'
        - 'ExterCond'
        - 'BsmtQual'
        - 'BsmtCond'
        - 'HeatingQC'
        - 'KitchenQual'
        - 'FireplaceQu'
        - 'GarageQual'
        - 'GarageCond'
        - 'PoolQC'
      order:
        - "None"
        - "Po"
        - "Fa"
        - "TA"
        - "Gd"
        - "Ex"

    exposure:
      features:
        - 'BsmtExposure'

      order:
        - "None"
        - "No"
        - "Mn"
        - "Av"
        - "Gd"

    basement:
      features:
        - 'BsmtFinType1'
        - 'BsmtFinType2'
      order:
        - "None"
        - "Unf"
        - "Lwq"
        - "Rec"
        - "BLQ"
        - "ALQ"
        - "GLQ"

    garage:
      features:
        - 'GarageFinish'
      order:
        - "None"
        - "Unf"
        - "RFn"
        - "Fin"

    fence:
      features:
        - 'Fence'
      order:
        - "None"
        - "MnWw"
        - "GdWo"
        - "MnPrv"
        - "GdPrv"


models:
  linear_models:
    liner_regression:
      fit_intercept: True
      normalize: False
      copy_X: True
      n_jobs: None
    Ridge:
      max_iter: 1000
      alpha: 1.0
      solver: 'auto'
      random_state: 42
    Lasso:
      alpha: 0.1
      random_state: 42
    ElasticNet:
      alpha: 0.1
      l1_ratio: 0.5
      random_state: 42

  distance_based_models:
    KNeighborsRegressor:
      n_neighbors: 5
      n_jobs: None
  
  tree_based_models:
    DecisionTreeRegressor:
      max_depth: None
      min_samples_split: 2
      min_samples_leaf: 1
      random_state: 42
    RandomForestRegressor:
      n_estimators: 100
      max_depth: None
      min_samples_split: 2
      min_samples_leaf: 1
      n_jobs: None
      random_state: 42
    GradientBoostingRegressor:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
      random_state: 42
    ExtraTreesRegressor:
      n_estimators: 100
      max_depth: None
      min_samples_split: 2
      min_samples_leaf: 1
      n_jobs: None
      random_state: 42
    HistGradientBoostingRegressor:
      max_iter: 100
      learning_rate: 0.1
      max_depth: None
      random_state: 42

  other_models:
    XGBRegressor:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
      random_state: 42
    LGBMRegressor:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: -1
      random_state: 42
    CatBoostRegressor:
      iterations: 100
      learning_rate: 0.1
      depth: 6
      random_state: 42
  

    


